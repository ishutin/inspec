<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>inspec review</title>
<link rel="stylesheet" href="../ui/app.css">
<script type="module" src="../ui/app.js"></script>
</head>
<body>
<div class="top">
  <div class="brand">inspec review <small id="docname"></small></div>
  <span class="round" id="round"></span>
  <div class="spacer"></div>
  <div class="progress"><div class="bar"><i class="ok" id="barOk"></i><i class="cm" id="barCm"></i></div><span id="ptext"></span></div>
  <button class="btn primary" id="submit" disabled>Loading…</button>
  <div class="seg" id="themeSeg" title="Theme">
    <button data-t="system">System</button><button data-t="light">Light</button><button data-t="dark">Dark</button>
  </div>
</div>
<div class="banner" id="banner" role="status" hidden></div>
<main id="app"><p class="loading">Loading…</p></main>
<div class="toast" id="toast" role="alert" hidden></div>
</body>
</html>
