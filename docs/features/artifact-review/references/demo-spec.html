<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>inspec review</title>
<style>
:root{
  --bg:#f7f7f5;--panel:#fff;--ink:#1d1d1b;--ink-2:#3d3c38;--muted:#76746e;--line:#e4e3de;--soft:#efeeea;
  --accent:#3b5bdb;--accent-ink:#fff;--ok:#2b8a3e;--ok-bg:#e6f4ea;--warn:#b35c00;--warn-bg:#fff3e0;
  --cm:#f2c94c55;--cm-strong:#e0a800;--del:#fde2e1;--ins:#dcf5e3;--code:#f1f0ec;
  --r:10px;--shadow:0 1px 2px #0000000d,0 4px 16px #0000000a;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--panel:#1b1b1a;--ink:#e6e4dd;--ink-2:#b9b7af;--muted:#85837c;--line:#2f2e2b;--soft:#262523;
  --accent:#7c94ff;--accent-ink:#0d0d0c;--ok:#5cc777;--ok-bg:#1c3324;--warn:#ffb05c;--warn-bg:#3a2a14;
  --cm:#e0a80040;--cm-strong:#f2c94c;--del:#4a1f1f;--ins:#1b3d27;--code:#262523;--shadow:none;}}
:root[data-theme="dark"]{
  --bg:#141413;--panel:#1b1b1a;--ink:#e6e4dd;--ink-2:#b9b7af;--muted:#85837c;--line:#2f2e2b;--soft:#262523;
  --accent:#7c94ff;--accent-ink:#0d0d0c;--ok:#5cc777;--ok-bg:#1c3324;--warn:#ffb05c;--warn-bg:#3a2a14;
  --cm:#e0a80040;--cm-strong:#f2c94c;--del:#4a1f1f;--ins:#1b3d27;--code:#262523;--shadow:none;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:.88em;font-family:ui-monospace,Menlo,monospace}
mark.cm{background:var(--cm);color:inherit;border-bottom:2px solid var(--cm-strong);border-radius:2px;cursor:pointer}
del{background:var(--del);text-decoration:line-through;opacity:.85}
ins{background:var(--ins);text-decoration:none}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:650;letter-spacing:-.01em}
.brand small{font-weight:400;color:var(--muted);margin-left:6px}
.seg{display:inline-flex;background:var(--soft);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:6px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.spacer{flex:1}
.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.bar{width:140px;height:6px;background:var(--soft);border-radius:3px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:8px;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:550}
.btn.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok);font-weight:550}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lbl{font-size:12px;color:var(--muted);margin-right:2px}

/* common block bits */
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.st{font-size:12px;padding:2px 8px;border-radius:99px;white-space:nowrap}
.st.ok{background:var(--ok-bg);color:var(--ok)}
.st.cm{background:var(--warn-bg);color:var(--warn)}
.st.new{background:var(--soft);color:var(--muted)}
.st.chg{background:var(--accent);color:var(--accent-ink)}
.flag{border-left:2px solid var(--warn);padding:2px 0 2px 12px;margin:18px 0;font-size:14.5px;line-height:1.6;color:var(--ink-2)}
.flag .lab{display:block;color:var(--warn);font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.tldr{font-size:18px;line-height:1.55;font-weight:400;color:var(--ink);margin:10px 0 0;letter-spacing:-.003em}
.body{font-size:15.5px;line-height:1.7;color:var(--ink-2);margin-top:14px}
.body p{margin:0 0 .7em}.body ul,.body ol{margin:0 0 .7em;padding-left:1.25em}.body li{margin:.2em 0}.body li::marker{color:var(--muted)}
.body b{font-weight:600;color:var(--ink)}
.card code,.body code{font-size:.84em;background:var(--soft);color:inherit;padding:.1em .35em;border-radius:4px}
.facts{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px;line-height:1.55;color:var(--ink-2)}
.facts dt{color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding-top:2px}
.facts dd{margin:0}.facts dd b{color:var(--ink);font-weight:600}
.check{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;margin-top:10px}
.src{white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--code);padding:10px;border-radius:8px;margin-top:10px}
.cmts{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.cmt{background:var(--soft);border-radius:8px;padding:8px 10px;font-size:13.5px}
.cmt q{display:block;color:var(--muted);font-size:12.5px;quotes:"«" "»";margin-bottom:2px}
.cmt .k{font-size:11px;font-weight:600;text-transform:uppercase;color:var(--warn);margin-right:6px}
.cmt .x{float:right;border:0;background:none;color:var(--muted);font-size:12px}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.linkish{border:0;background:none;color:var(--muted);font-size:13px;padding:0;text-decoration:underline dotted}
.carry{font-size:12.5px;color:var(--ok)}

/* layout A: focus */
.A{max-width:760px;margin:24px auto;padding:0 16px}
.A .dots{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.A .dots button{width:28px;height:8px;border:0;border-radius:4px;background:var(--soft);padding:0}
.A .dots button.ok{background:var(--ok)}.A .dots button.cm{background:var(--cm-strong)}.A .dots button.cur{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 32px 22px;box-shadow:var(--shadow)}
.card .actions{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.card .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2{margin:10px 0 0;font-size:24px;line-height:1.25;font-weight:650;letter-spacing:-.015em;color:var(--ink)}
.A .nav{display:flex;justify-content:space-between;margin-top:14px;color:var(--muted);font-size:13px}
.kbd{font-family:ui-monospace,Menlo,monospace;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px}

/* layout B: document */
.B{display:grid;grid-template-columns:220px minmax(0,1fr) 300px;gap:0;min-height:calc(100vh - 54px)}
.B .toc{border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:54px;height:calc(100vh - 54px);overflow:auto}
.B .toc a{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:13.5px}
.B .toc a:hover{background:var(--soft)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.dot.ok{background:var(--ok)}.dot.cm{background:var(--cm-strong)}.dot.chg{background:var(--accent)}
.B .doc{padding:20px 28px 80px;max-width:780px}
.B .blk{position:relative;padding:14px 16px 14px 18px;border-radius:10px;margin-bottom:10px;border:1px solid transparent}
.B .blk:hover{border-color:var(--line);background:var(--panel)}
.B .blk::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:2px;background:var(--line)}
.B .blk.ok::before{background:var(--ok)}.B .blk.cm::before{background:var(--cm-strong)}.B .blk.chg::before{background:var(--accent)}
.B .blk h3{margin:0;font-size:17px}
.B .blk .hd{display:flex;align-items:center;gap:8px;justify-content:space-between}
.B .blk .actions{margin-top:8px}
.B .blk.ok .body{opacity:.72}
.B .rail{border-left:1px solid var(--line);padding:16px;position:sticky;top:54px;height:calc(100vh - 54px);overflow:auto}
.B .rail h4{margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:600}

/* layout C: checklist */
.C{max-width:880px;margin:20px auto;padding:0 16px}
.C .row{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.C .rh{display:grid;grid-template-columns:28px 64px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}
.C .rh .t{font-size:14.5px}
.C .rh .id{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted)}
.C .rb{padding:0 16px 14px 114px;border-top:1px solid var(--line);padding-top:12px}
.C .grp{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 4px 8px}
.ck{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;background:var(--panel)}
.ck.ok{background:var(--ok);border-color:var(--ok);color:#fff}.ck.cm{background:var(--cm-strong);border-color:var(--cm-strong);color:#000}

/* popovers */
.pop{position:absolute;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px #0003;padding:8px}
.pop textarea{width:280px;height:80px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px;font:inherit;font-size:14px;resize:vertical}
.pop .kinds{display:flex;gap:4px;margin:6px 0}
.pop .kinds button{font-size:12px;border:1px solid var(--line);background:none;border-radius:99px;padding:2px 8px}
.pop .kinds button.on{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;z-index:60;padding:16px}
.modal>div{background:var(--panel);border-radius:14px;max-width:640px;width:100%;padding:20px;max-height:85vh;overflow:auto}
.modal pre{background:var(--code);padding:12px;border-radius:8px;font-size:12px;overflow:auto}
.round{font-size:12.5px;background:var(--soft);padding:3px 9px;border-radius:99px;color:var(--muted)}

@media (max-width:900px){
  .B{grid-template-columns:1fr}.B .toc,.B .rail{display:none}.B .doc{padding:16px}
  .C .rb{padding-left:16px}.C .rh{grid-template-columns:24px minmax(0,1fr) auto}.C .rh .id{display:none}
}

/* focus + topic list */
.F{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 54px)}
.F .toc{border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:54px;height:calc(100vh - 54px);overflow:auto}
.F .toc .tg{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:12px 8px 4px}
.F .toc a{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:13.5px;cursor:pointer}
.F .toc a:hover{background:var(--soft)}.F .toc a.cur{background:var(--soft);font-weight:600}
.F .toc .fl{margin-left:auto;color:var(--warn);font-size:12px}
.F .stage{max-width:760px;width:100%;margin:28px auto;padding:0 16px}
.F .nav{display:flex;justify-content:space-between;margin-top:14px;color:var(--muted);font-size:13px}
@media (max-width:760px){
  .F{grid-template-columns:1fr;grid-template-rows:auto 1fr;min-height:0}
  .F .toc{position:sticky;top:0;z-index:5;height:auto;background:var(--bg);border-right:0;border-bottom:1px solid var(--line);display:flex;align-items:center;overflow-x:auto;gap:4px;padding:8px 12px;scrollbar-width:none}
  .F .toc .tg{display:none}
  .F .toc a{flex:none;white-space:nowrap;padding:4px 10px;border:1px solid var(--line);border-radius:99px;font-size:13px}
  .F .toc a.cur{border-color:var(--accent)}
  .F .stage{margin:16px auto}
  .card{padding:20px 18px 16px}.card h2{font-size:20px}.tldr{font-size:16.5px}.facts{grid-template-columns:1fr;gap:2px}.facts dd{margin-bottom:8px}
  .top{position:static}
}

/* diagrams */
.dia{margin:18px 0 6px}
.dia .cap{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.mx{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;font-size:14px;line-height:1.45}
.mx>div{padding:10px 12px;border-radius:8px;background:var(--soft);color:var(--ink-2)}
.mx .h{background:none;color:var(--muted);font-size:12.5px;padding:4px 12px}
.mx .r{background:none;color:var(--ink);font-weight:600;font-size:13.5px;display:flex;align-items:center;padding-left:0}
.mx .st{display:inline-block;margin-bottom:4px}
.flow{display:flex;font-size:13.5px;line-height:1.4;list-style:none;margin:0;padding:0}
.flow li{display:flex;align-items:stretch;flex:1 1 0;min-width:0}
.flow li .n{flex:1}
.flow li+li::before{content:"→";align-self:center;color:var(--muted);padding:0 8px}
.flow .n{background:var(--soft);border-radius:8px;padding:8px 10px;color:var(--ink-2)}
.flow .n b{display:block;color:var(--ink);font-weight:600;font-size:12.5px;margin-bottom:2px}
.flow .n.you{background:transparent;border:1px dashed var(--accent)}
.dia .note{font-size:13px;color:var(--muted);margin-top:10px}
.stt{display:grid;grid-template-columns:auto auto auto 1fr;gap:6px 10px;align-items:center;font-size:14px}
.stt .s{background:var(--soft);border-radius:6px;padding:3px 9px;color:var(--ink);white-space:nowrap;font-size:13px}
.stt .ar{color:var(--muted)}.stt .on{color:var(--ink-2)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:14px;line-height:1.5}
.cmp>div{background:var(--soft);border-radius:8px;padding:10px 12px;color:var(--ink-2)}
.cmp b{display:block;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.cmp .after{box-shadow:inset 2px 0 0 var(--ok)}
@media (max-width:760px){.flow{flex-direction:column}.flow li{flex-direction:column}.flow li+li::before{content:"↓";align-self:flex-start;padding:4px 14px}.flow .n{max-width:none}.cmp{grid-template-columns:1fr}.stt{grid-template-columns:auto auto auto;}.stt .on{grid-column:1/-1;margin:-2px 0 6px}}
.lead-q{color:var(--muted);font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin:18px 0 4px}
@media (max-width:760px){.mx{grid-template-columns:1fr!important}.mx .h{display:none}.mx .r{padding:10px 0 0}}
</style>
</head>
<body>
<div class="top">
  <div class="brand">inspec review <small>artifact-review · spec.md</small></div>
  <span class="round" id="round">Round 1</span>
  <div class="spacer"></div>
  <div class="progress"><div class="bar" id="bar"></div><span id="ptext"></span></div>
  <button class="btn primary" id="submit">Submit</button>
  <div class="seg" id="themeSeg" title="Theme">
    <button data-t="system">System</button><button data-t="light">Light</button><button data-t="dark">Dark</button>
  </div>
</div>
<main id="app"></main>

<script>
/* ---------- demo data: what the converter would produce from spec.md ---------- */
const R1 = [
{
"id": "overview",
"tag": "Обзор",
"title": "О чём эта спека",
"tldr": "Команда /inspec:read открывает intent, spec или plan как локальную страницу из коротких блоков: каждый можно одобрить или прокомментировать, а итог уходит обратно в сессию.",
"body": "<p>Это спека к брифу <code>docs/features/artifact-review/intent.md</code>; там описаны результаты O1–O13, на которые ссылаются строки контракта.</p>",
"src": "`/inspec:read` opens an intent, spec or plan as a local web page of short blocks to approve or comment on, and\nreturns the verdict to the session. Intent: `docs/features/artifact-review/intent.md` (outcomes O1–O12)."
},
{
"id": "S1",
"tag": "Контракт · Prepare",
"title": "S1 · Нарезка на блоки",
"tldr": "prepare режет документ на блоки по правилам нарезки и печатает по JSON-объекту на каждый блок, для которого ещё нет текста показа.",
"body": "<p>Вызов: <code>prepare &lt;md&gt; --id &lt;slug&gt;/&lt;kind&gt; --lang &lt;tag&gt;</code>. Правила нарезки — в разделе «Архитектура → Правила нарезки».</p><p>На трёх фикстурах порядок id должен быть ровно таким:</p><ul><li><b>intent</b>: <code>problem, who, O1 … O12, headline-scenario, references, not-in-scope</code>;</li><li><b>plan</b>: <code>D1, D2</code>;</li><li><b>spec</b>: список из <code>tests/read/fixtures/spec.ids</code>, снятый с этой спеки в том виде, в каком она закоммичена.</li></ul>",
"src": "## Contract\n- **S1** `prepare <md> --id <slug>/<kind> --lang <tag>` splits the document by the Split rules (Architecture)\n  and prints one JSON object per block it needs a display for. On the fixtures the block ids, in order, are:\n  intent → `problem, who, O1, O2, O3, O4, O5, O6, O7, O8, O9, O10, O11, O12, headline-scenario, references,\n  not-in-scope`; plan → `D1, D2`; spec → the list in `tests/read/fixtures/spec.ids`, taken from this file as\n  committed. — check: `node --test --test-timeout=30000 tests/read/prepare.test.mjs`",
"check": "Тест CLI: <code>node --test tests/read/prepare.test.mjs</code>"
},
{
"id": "S2",
"tag": "Контракт · Prepare",
"title": "S2 · Хеш зависит только от своего блока",
"tldr": "Хеш блока считается только по его собственному исходному тексту.",
"body": "<ul><li>Два запуска prepare на одном документе дают одинаковые хеши.</li><li>Правка одного блока меняет хеш только этого блока, остальные остаются прежними.</li><li>Пробелы в конце строк и пустые строки в конце блока хеш не меняют.</li></ul>",
"src": "- **S2** A block's hash depends only on its own source: two prepares give the same hashes; editing one block\n  changes that block's hash and no other; trailing spaces and trailing blank lines change none. — check:\n  `node --test --test-timeout=30000 tests/read/prepare.test.mjs`",
"check": "Тест CLI: <code>node --test tests/read/prepare.test.mjs</code>",
"diagram": {
"type": "compare",
"caption": "Правка одного блока",
"before": {
"label": "До правки S3",
"text": "у S3 хеш `a1b2…`, у S4 — `c3d4…`"
},
"after": {
"label": "После правки S3",
"text": "у S3 новый хеш, у S4 по-прежнему `c3d4…`"
}
}
},
{
"id": "S3",
"tag": "Контракт · Prepare",
"title": "S3 · Текст показа пишется один раз",
"tldr": "prepare просит текст показа только для блоков, у которых его ещё нет на нужном языке; после записи текстов повторный prepare печатает [].",
"body": "<p>Печатаются ровно те блоки, для хеша которых нет записи показа на языке <code>--lang</code>. Когда записи написаны, повторный prepare неизменённого документа печатает <code>[]</code>, а страница показывает эти записи без единого изменения (O9).</p>",
"src": "- **S3** prepare prints exactly the blocks whose hash has no display entry for `--lang`; once they are written, a\n  second prepare of the unchanged document prints `[]`, and the page shows those entries unchanged (O9). —\n  check: `node --test --test-timeout=30000 tests/read/prepare.test.mjs`",
"check": "Тест CLI: <code>node --test tests/read/prepare.test.mjs</code>",
"diagram": {
"type": "compare",
"caption": "Зачем это нужно",
"before": {
"label": "Без кеша",
"text": "каждый раунд модель пишет текст заново — один и тот же блок звучит по-разному, приходится перечитывать"
},
"after": {
"label": "С кешем по хешу",
"text": "пока исходник блока не менялся, его текст и схема те же байт в байт"
}
}
},
{
"id": "S4",
"tag": "Контракт · Prepare",
"title": "S4 · Ошибки на входе prepare",
"tldr": "На плохом входе prepare завершается с кодом 2, пишет причину в stderr и ничего не создаёт в папке состояния.",

"body": "<ul><li>Первая строка stdout: <code>inspec-read: &lt;url&gt;</code>; в адресе токен из 32 hex-символов.</li><li>Любой запрос, в пути которого нет токена, получает 404.</li><li>Браузер открывается командой <code>open &lt;url&gt;</code> на macOS и <code>xdg-open &lt;url&gt;</code> на Linux, если не передан <code>--no-open</code>.</li><li>Если ни одной из этих команд нет в <code>PATH</code>, сервер всё равно работает.</li></ul>",

"title": "S12 · Старт следующего раунда",

"body": "<p>Новый раунд начинается после <b>любой</b> отправки — и с замечаниями, и после полного одобрения. Стартовый статус блока зависит от двух вещей: что ты сделал с ним в прошлом раунде и изменился ли его хеш.</p><p>Блок, которого раньше не было, приходит как «Not reviewed»; удалённый из документа исчезает. Если прошлый раунд закончился одобрением и правок не было, все блоки сразу «Approved in round K».</p>",
"src": "- **S12** prepare after any submitted round N starts round N+1. Each block starts as follows. If it was approved\n  and its hash is unchanged, it stays approved, labelled \"Approved in round K\". If it was approved and its hash\n  changed, it is \"Changed after approval\". If it had comments and its hash changed, it is \"Changed\". If it had\n  comments and its hash is unchanged, it is \"Not reviewed\", with those comments shown read-only. A new block is\n  \"Not reviewed\", and a removed block is gone. After an `approved` round with no edits, every block is\n  \"Approved in round K\". — check: `npx playwright test tests/read/ui.spec.mjs`",

"title": "S15 · Список тем и карточка блока",
"tldr": "Слева — все блоки по разделам со статусом и ⚑, справа — один блок в фокусе со всеми его полями.",
"body": "<p><b>Список тем.</b> Каждый блок под названием своего раздела: заголовок, точка статуса (у «Not reviewed», «Approved», «Has comments» и «Changed» — разные цвета) и ⚑, если у блока есть флаг.</p><p><b>Карточка.</b> Раздел, «n of N», заголовок, сводка, флаг, текст, проверка, «Covers intent» с номерами и текстами результатов, схема и комментарии. Пустые поля не показываются.</p><p><b>Управление.</b></p><ul><li>клик по теме — фокус на ней;</li><li>↑/↓ и j/k — перемещение;</li><li>Enter вне поля комментария — одобрить и перейти к следующему неодобренному; на уже одобренном — вернуть в «Not reviewed»;</li><li>C — комментарий ко всему блоку.</li></ul><p>Фикстура спеки из S1 рендерит все свои блоки.</p>",
"src": "- **S15** The topic list shows every block, grouped under its section name, each with its title, a status dot\n  whose colour differs for each of \"Not reviewed\", \"Approved\", \"Has comments\" and \"Changed\", and ⚑ when the\n  block has a flag. The focused block shows its section, \"n of N\", title, summary, flag, body, check, \"Covers\n  intent\" with outcome ids and texts, the diagram, and comments; a field that is empty is not shown. Clicking a\n  topic focuses it; ↑/↓ and j/k move; Enter outside the comment box approves and moves to the next block that\n  is not approved, and on an approved block makes it \"Not reviewed\"; C opens a comment on the block. The spec fixture of S1 renders every block. — check:\n  `npx playwright test tests/read/ui.spec.mjs`",

{
"id": "architecture/state",
"tag": "Архитектура",
"title": "Состояние",
"tldr": "Всё рабочее лежит в .git/inspec-read/<slug>/<kind>/ — вне дерева проекта, ты его не видишь.",
"body": "<p>Путь: <code>$(git rev-parse --git-dir)/inspec-read/&lt;slug&gt;/&lt;kind&gt;/</code>.</p><ul><li><code>blocks.json</code> — документ, kind, язык, раунд и блоки: id, раздел, группа, исходник, хеш.</li><li><code>display/&lt;hash&gt;.&lt;lang&gt;.json</code> — текст показа, его пишет сессия. Поля:<ul><li><code>section</code> — заголовок раздела на языке показа;</li><li><code>title</code> — id блока, « · » и короткое название (без id — только название);</li><li><code>tldr</code> — одно предложение;</li><li><code>body</code> — исходник, переписанный для удобного чтения технарём: не упрощённый, все факты, числа, имена, условия, команды и пути на месте, ничего не добавлено; придуманные документом термины поясняются при первом упоминании;</li><li><code>check</code> — для строки контракта одно предложение о том, чем она доказывается, с командой;</li><li><code>flag</code> — решение, принятое сессией без оператора; в чужой сессии всегда <code>null</code>;</li><li><code>covers</code> — для строки контракта номера и тексты результатов брифа;</li><li><code>diagram</code> — <code>null</code> или одна схема типа flow, matrix, states или compare, только где картинка показывает лучше текста; она повторяет текст, а не заменяет его.</li></ul>Этот кеш и даёт O9: prepare никогда не просит текст для одного хеша дважды.</li><li><code>review.json</code> — статусы (<code>new</code>, <code>ok</code>, <code>cm</code>, <code>chg</code>) и комментарии по блокам; id комментариев — <code>c&lt;раунд&gt;-&lt;n&gt;</code>.</li><li><code>result.json</code> — последняя отправка; <code>replies.json</code> — ответы на вопросы от сессии перед prepare.</li></ul>",
"src": "### State\n\nOutside the tree, per document: `$(git rev-parse --git-dir)/inspec-read/<slug>/<kind>/`:\n- `blocks.json`: `{doc, kind, lang, round, blocks:[{id, section, group, source, hash}]}`.\n- `display/<hash>.<lang>.json`: written by the session.\n  `{section, title, tldr, body, check, flag, covers}`:\n  - `section`: the `##` heading in `lang`.\n  - `title`: the block's id token, then ` · ` and a short name in `lang`; without a token, the name alone.\n  - `tldr`: one sentence.\n  - `body`: markdown in `lang`. It is the source rewritten for a technical person to read easily, not\n    simplified. Every fact, number, name, condition, command and path stays, and nothing is added. The id\n    token and the check move to their own fields. Order, lists, short paragraphs and plain sentences serve the\n    reader. Jargon the document coins is explained on first use.\n  - `check`: for a contract row, one sentence on what proves it, with the command in inline code; otherwise\n    `null`.\n  - `flag`: a choice the session made without the operator, or `null`. It is always `null` in a session that\n    did not write the document.\n  - `covers`: `[{id, text}]` for a contract row, naming the intent outcomes the row serves; otherwise `[]`.\n  - `diagram`: `null` or one typed object, set only where a picture shows the content better than text; it\n    repeats the body and never replaces it. Every text is plain, with backtick spans as code. Each has an\n    optional `caption` and `note`:\n    - `flow`: `{steps:[{label, text, actor?: \"you\"}], loop?}`;\n    - `matrix`: `{cols:[text], rows:[{label, cells:[{text, tag?, tone?: \"ok\"|\"changed\"|\"new\"|\"warn\"}]}]}`,\n      with one cell per column;\n    - `states`: `{transitions:[{from, to, on}]}`;\n    - `compare`: `{before:{label, text}, after:{label, text}}`.\n\n  This cache is what makes O9 hold: prepare never asks twice for a hash.\n- `review.json`: `{round, blocks:{<id>:{status:\"new\"|\"ok\"|\"cm\"|\"chg\", hash, approvedRound, prevHash, wasApproved,\n  comments:[{id, quote, kind, text, reply, round}]}}}`. Comment ids are `c<round>-<n>`.\n- `result.json`: the last submit (S7, S8). `replies.json` is written by the session before prepare (S14).",
"flag": "Хранить состояние в .git/ агент решил сам."
},
{
"id": "architecture/split-rules",
"tag": "Архитектура",
"title": "Правила нарезки",
"tldr": "Блоки выделяются по структуре документа, без модели, поэтому при каждом запуске одинаково.",
"body": "<p>Правила применяются после front matter и строки с <code>#</code>.</p><ol><li>Текст до первого <code>##</code>, если он не пустой, — блок <code>overview</code>.</li><li><code>##</code> открывает раздел. Его id — токен из заголовка (<code>## D1 — …</code>), иначе slug: строчные буквы, всё, что не буква и не цифра, — в <code>-</code>, кириллица сохраняется, повторы получают <code>-2</code>, <code>-3</code>.</li><li>Внутри раздела:<ul><li>пункт верхнего уровня вида <code>- **S1**</code> вместе со строками-продолжениями — блок с этим id;</li><li><code>###</code> до следующего <code>###</code> или <code>##</code> — блок <code>раздел/подраздел</code>;</li><li>прочий текст — блоки прозы: первый получает id раздела, следующие — <code>-2</code>, <code>-3</code>; пустые строки блоков не дают;</li><li>строка заголовка раздела входит в его первый блок;</li><li>в разделе с id-пунктами одна строка, кончающаяся двоеточием, — не блок, а подпись группы для пунктов после неё.</li></ul></li></ol><p>Регулярка токена ловит <code>- **S1** …</code> и <code>- **O1 Offered…**</code>, но не <code>- **Problem** — …</code> и не <code>- [ ] S1</code>.</p><p>Хеш — sha256 исходника без пробелов в конце строк и без пустых строк в конце, первые 12 hex-символов; название раздела в хеш не входит.</p>",
"src": "### Split rules\n\n`parse.mjs`, applied after the front matter and the `#` line:\n1. Text before the first `##` is the block `overview`, if it is not blank.\n2. A `##` heading opens a section. Its id is the heading's id token, when it opens with one\n   (`^## ([A-Z][0-9]+)\\b`). Otherwise the id is its slug: lowercase, every run of characters that are not\n   letters or digits becomes `-`, Cyrillic is kept, and a repeat gets `-2`, `-3`.\n3. Inside a section:\n   - A top-level item matching `^- \\*\\*([A-Z][0-9]+)\\b`, with its indented continuation lines, is a block\n     whose id is the token.\n   - A `###` subsection, up to the next `###` or `##`, is the block `<section>/<sub-slug>`.\n   - Each run of other lines is a prose block. The first run takes the section's id, and later runs take\n     `-2`, `-3`.\n   - A run holding only blank lines is no block.\n   - A section's heading line belongs to its first block.\n   - In a section with id items, a prose run that is one line ending in `:` is no block: it is the group\n     label of the items after it (`group` in `blocks.json`), shown above them in the topic list.\n\nThe token regex matches `- **S1** <who observes…` (criteria.md) and `- **O1 Offered at the right moment.**`\n(this intent). It does not match `- **Problem** — the user's current experience` (brief SKILL.md) or\n`- [ ] S1` (the plan template).\n\nHash: sha256 of the block source with trailing spaces removed from each line and trailing blank lines removed,\nfirst 12 hex characters. `section` is not part of it.",
"flag": "Правило «строка с двоеточием — подпись группы» агент добавил сам после пробной нарезки этой спеки."
},
{
"id": "architecture/rounds",
"tag": "Архитектура",
"title": "Раунды",
"tldr": "Если уже есть result.json, prepare начинает новый раунд; иначе пересобирает текущий и сохраняет статусы неизменённых блоков.",
"body": "<p>Перенос статусов — по S12. <code>prevHash</code> — хеш на момент последней отправки; <code>diff.js</code> сравнивает старый и новый текст показа по словам (LCS).</p>",
"src": "### Rounds\n\nprepare starts round N+1 when `result.json` holds round N. Otherwise it rebuilds round N and keeps\n`review.json` entries whose hash is unchanged. Carry follows S12. `prevHash` is the hash at the last submit, and\n`diff.js` diffs `display/<prevHash>` against the new display word by word (LCS).",
"diagram": {
"type": "states",
"transitions": [
{
"from": "раунд N",
"to": "раунд N",
"on": "prepare без отправки — пересборка, статусы сохраняются"
},
{
"from": "раунд N",
"to": "раунд N+1",
"on": "prepare после отправки (есть result.json)"
}
]
}

{
"id": "architecture/http",
"tag": "Архитектура",
"title": "HTTP",
"tldr": "Четыре маршрута под /<token>/: страница, данные документа, сохранение ревью и отправка.",
"body": "<ul><li><code>GET /</code> — страница и её файлы;</li><li><code>GET api/doc</code> — документ, kind, язык, раунд, блоки с текущим и прошлым текстом показа, ревью;</li><li><code>PUT api/review</code> — страница присылает всё ревью при каждом изменении; 400 на неизвестный id или тип, иначе 204;</li><li><code>POST api/submit</code> — 409, пока есть незавершённые блоки, иначе 200; затем serve пишет и печатает результат и завершается.</li></ul><p>Браузер открывается через <code>open</code> на macOS и <code>xdg-open</code> на Linux; если не вышло — serve просто печатает адрес.</p>",
"src": "### HTTP\n\n`server.mjs`, all routes under `/<token>/`:\n- `GET /`: the page and its assets.\n- `GET api/doc`: `{doc, kind, lang, round, blocks:[{id, section, source, hash, display, prevDisplay}], review}`.\n- `PUT api/review`: the page sends the whole review on each change. Returns 400 on an unknown id or kind,\n  else 204.\n- `POST api/submit`: returns 409 while blocks are pending, else 200. serve then writes and prints the result\n  and exits.\n\nThe opener is `open` on darwin and `xdg-open` on linux. If the opener fails, serve only prints the url."
},
{
"id": "architecture/session-flow",
"tag": "Архитектура",
"title": "Сценарий сессии",
"tldr": "Сессия готовит документ, открывает страницу и ждёт тебя без ограничения по времени; после отправки правит и запускает следующий раунд.",
"body": "<p>Запуск: <code>/inspec:read &lt;slug&gt; [intent|spec|plan]</code>; без kind берётся самый свежий документ — plan, иначе spec, иначе intent. Тот же сценарий запускается из brief, spec и plan, если ты выбрал ревью там.</p><ol><li>Нужен Node ≥ 18 — иначе сессия говорит об этом и продолжает в чате.</li><li>Язык показа — язык, на котором ты пишешь.</li><li>Документ берётся из рабочего дерева, иначе <code>git show feature/&lt;slug&gt;:docs/features/&lt;slug&gt;/&lt;kind&gt;.md</code> во временный <code>&lt;kind&gt;.md</code>.</li><li><code>node &lt;папка скилла&gt;/iar/iar.mjs prepare &lt;md&gt; --id &lt;slug&gt;/&lt;kind&gt; --lang &lt;lang&gt;</code>, затем запись показа для каждого напечатанного блока.</li><li><code>serve</code> в фоне (<code>run_in_background: true</code>) — сессия просыпается, когда он завершится.</li><li><code>approved</code> — документ согласован. <code>changes_requested</code> — правки через свой скилл (spec.md только через <code>/inspec:spec</code>), ответы на вопросы в <code>replies.json</code>, снова шаг 4.</li><li>Если ты пишешь в чат раньше отправки — сессия останавливает фоновую задачу, делает <code>drop</code> и действует по чату.</li></ol>",
"src": "### Session flow\n\n`skills/read/SKILL.md` runs as `/inspec:read <slug> [intent|spec|plan]`; the default kind is the\nnewest that exists (plan, else spec, else intent). The flow is also followed from brief, spec and plan when the\noperator picks the review there.\n1. Check `node --version` ≥ 18; if not, say so and continue in chat.\n2. `lang` is the language the operator writes in.\n3. Pick the document: the working-tree file when it is there, else\n   `git show feature/<slug>:docs/features/<slug>/<kind>.md` into a temp file named `<kind>.md`.\n4. Run `node <skill dir>/iar/iar.mjs prepare <md> --id <slug>/<kind> --lang <lang>`. For every printed block,\n   write its display entry.\n5. Run `serve` with Bash `run_in_background: true`. The harness wakes the session when it exits.\n6. On `approved`, the document is agreed. On `changes_requested`, edit through the owning skill (spec.md only\n   through `/inspec:spec`), write `replies.json` for the questions, and go to 4.\n7. If the operator writes in chat first, stop the background task, run `drop`, and act on the chat.",

{
"id": "architecture/offer-placement",
"tag": "Архитектура",
"title": "Где появляется предложение",
"tldr": "Ревью предлагается там, где оператор сейчас соглашается с документом: в конце brief, spec и plan перед коммитом.",

"src": "## References\n\n- `mockup.html` is the agreed page, a copy of `references/prototype-focus.html`. It shows the topic list and\n  focus card, flags, covers, comment kinds, the round-2 diff, the theme switch and the narrow layout. S24 is\n  judged against it.\n- `references/demo-spec.html`: this spec as it would look in the tool, with Russian texts. S3, S12, S18\n  and \"Session flow\" show the rewritten body and the four diagram types; the other blocks are early drafts.\n- `references/prototype-v1-three-layouts.html`: rejected layouts, context only."

];
const R2_PATCH = {};
const OUTCOMES={"O1": "Предложение в нужный момент", "O2": "Короткие блоки, удобные для чтения", "O3": "Видно, где ты", "O4": "Одобрение по блокам", "O5": "Точные комментарии", "O6": "Решения агента видны", "O7": "Связь с брифом", "O8": "Отправить и вернуться", "O9": "Тот же текст, если не правили", "O10": "Ничего не теряется", "O11": "Тема", "O12": "Ожидание", "O13": "Схема, где помогает"};
const COVERS={"S1": ["O2"], "S2": ["O8", "O9"], "S3": ["O9"], "S5": ["O13"], "S6": ["O2"], "S7": ["O8"], "S8": ["O5", "O8"], "S9": ["O8"], "S10": ["O10"], "S11": ["O12"], "S12": ["O8"], "S13": ["O8"], "S14": ["O5"], "S15": ["O3", "O4", "O6", "O7"], "S16": ["O5"], "S17": ["O2"], "S18": ["O8", "O12"], "S19": ["O11"], "S20": ["O3"], "S21": ["O2"], "S22": ["O2"], "S23": ["O13"], "S24": ["O3", "O11"], "S25": ["O1"], "S26": ["O1", "O7"], "S27": ["O1", "O2", "O12", "O13"]};

/* ---------- state (resumable) ---------- */
let round=1, blocks=JSON.parse(JSON.stringify(R1)), st={}, cur=0, showSrc=new Set();
blocks.forEach(b=>st[b.id]={status:'new',comments:[]});
function localGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function localSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
try{const saved=JSON.parse(localGet('iar.demo-spec'));if(saved){({round,st,cur}=saved);if(saved.blocks)blocks=saved.blocks}}catch(e){}
function save(){localSet('iar.demo-spec',JSON.stringify({round,st,cur,blocks}))}

/* ---------- theme ---------- */
function setTheme(t){if(t==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=t;
  localSet('iar.theme',t);document.querySelectorAll('#themeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
setTheme(localGet('iar.theme')||'system');
themeSeg.onclick=e=>{if(e.target.dataset.t)setTheme(e.target.dataset.t)};

/* ---------- helpers ---------- */
const stLabel={new:'Not reviewed',ok:'Approved',cm:'Has comments',chg:'Changed'};
function badge(id){const s=st[id];return `<span class="st ${s.status}">${s.status==='ok'&&s.carried?'Approved in round '+s.carried:s.status==='chg'&&s.wasOk?'Changed after approval':stLabel[s.status]}</span>`}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function cmtsHtml(id){return st[id].comments.length?`<div class="cmts">${st[id].comments.map((c,i)=>`<div class="cmt"><button class="x" onclick="delCmt('${id}',${i})">remove</button>${c.quote?`<q>${esc(c.quote)}</q>`:''}<span class="k">${c.kind}</span>${esc(c.text)}${c.reply?`<div style="margin-top:6px;color:var(--muted)"><b>Agent:</b> ${esc(c.reply)}</div>`:''}</div>`).join('')}</div>`:''}
/* ---------- diagrams: typed JSON, drawn by the page ---------- */
function dt(t){return esc(String(t??'')).replace(/`([^`]+)`/g,'<code>$1</code>')}
const DIAGRAMS={
  flow:d=>`<ol class="flow">${d.steps.map(x=>`<li><div class="n ${x.actor==='you'?'you':''}"><b>${dt(x.label)}</b>${dt(x.text)}</div></li>`).join('')}</ol>${d.loop?`<div class="note">↺ ${dt(d.loop)}</div>`:''}`,
  matrix:d=>`<div class="mx" style="grid-template-columns:auto ${d.cols.map(()=> '1fr').join(' ')}"><div class="h"></div>${d.cols.map(c=>`<div class="h">${dt(c)}</div>`).join('')}${d.rows.map(r=>`<div class="r">${dt(r.label)}</div>${r.cells.map(c=>`<div>${c.tag?`<span class="st ${({ok:'ok',changed:'chg',new:'new',warn:'cm'})[c.tone]||'new'}">${dt(c.tag)}</span><br>`:''}${dt(c.text)}</div>`).join('')}`).join('')}</div>`,
  states:d=>`<div class="stt">${d.transitions.map(t=>`<span class="s">${dt(t.from)}</span><span class="ar">→</span><span class="s">${dt(t.to)}</span><span class="on">${dt(t.on)}</span>`).join('')}</div>`,
  compare:d=>`<div class="cmp"><div><b>${dt(d.before.label)}</b>${dt(d.before.text)}</div><div class="after"><b>${dt(d.after.label)}</b>${dt(d.after.text)}</div></div>`,
};
function renderDiagram(d){const f=DIAGRAMS[d&&d.type];if(!f)return '';
  return `<figure class="dia" data-content style="margin:18px 0 6px">${d.caption?`<figcaption class="cap">${dt(d.caption)}</figcaption>`:''}${f(d)}${d.note?`<div class="note">${dt(d.note)}</div>`:''}</figure>`}
function trace(b){const c=COVERS[b.id];if(!c)return '';return `<dt>Covers</dt><dd>${c.map(o=>`<b>${o}</b> ${OUTCOMES[o]}`).join('<br>')}</dd>`}
function content(b){return `
  <div class="tldr" data-sel="${b.id}">${b.tldr}</div>
  ${b.flag?`<div class="flag"><span class="lab">⚑ Agent's decision</span><span data-sel="${b.id}">${b.flag}</span></div>`:''}
  ${b.body?`<div class="body" data-sel="${b.id}">${b.body}</div>`:''}
  ${b.diagram?renderDiagram(b.diagram):''}
  ${b.check||COVERS[b.id]?`<dl class="facts">${b.check?`<dt>Check</dt><dd data-sel="${b.id}">${b.check}</dd>`:''}${trace(b)}</dl>`:''}
  ${showSrc.has(b.id)?`<div class="src">${esc(b.src)}</div>`:''}
  ${cmtsHtml(b.id)}`}
function acts(b){const s=st[b.id].status;return `<div class="actions">
  <button class="btn ${s==='ok'?'ok':'primary'}" onclick="approve('${b.id}')">${s==='ok'?'✓ Approved':'Approve'} <span class="kbd">↵</span></button>
  <button class="btn" id="cbtn" onclick="blockComment(event,'${b.id}')">Comment on block <span class="kbd">C</span></button>
  <button class="linkish" onclick="toggleSrc('${b.id}')">${showSrc.has(b.id)?'Hide source':'Show source'}</button></div>`}
function nextOpen(i){for(let k=1;k<=blocks.length;k++){const j=(i+k)%blocks.length;if(st[blocks[j].id].status!=='ok')return j}return i}

window.approve=id=>{const s=st[id];
  if(s.status==='ok'){s.status=s.comments.length?'cm':'new';delete s.carried}
  else{s.status='ok';s.comments=[];cur=nextOpen(cur)}
  render()};
window.toggleSrc=id=>{showSrc.has(id)?showSrc.delete(id):showSrc.add(id);render()};
window.delCmt=(id,i)=>{st[id].comments.splice(i,1);if(!st[id].comments.length&&st[id].status==='cm')st[id].status='new';render()};
window.go=i=>{cur=i;render()};

/* ---------- layout: topic list + focus card ---------- */
function view(){const b=blocks[cur];let lastTag='';
  return `<div class="F">
  <nav class="toc">${blocks.map((x,i)=>{const g=x.tag!==lastTag?`<div class="tg">${x.tag}</div>`:'';lastTag=x.tag;
     return g+`<a class="${i===cur?'cur':''}" onclick="go(${i})"><span class="dot ${st[x.id].status}"></span><span>${x.title}</span>${x.flag?'<span class="fl">⚑</span>':''}</a>`}).join('')}</nav>
  <div class="stage"><div class="card"><div class="hd"><span class="tag">${b.tag} · ${cur+1} of ${blocks.length}</span>${badge(b.id)}</div>
  <h2>${b.title}</h2>${content(b)}${acts(b)}</div>
  <div class="nav"><span><span class="kbd">↑</span> <span class="kbd">↓</span> move · <span class="kbd">↵</span> approve · select text to comment</span><span>${blocks.filter(x=>st[x.id].status!=='ok').length} left</span></div></div></div>`}

function render(){
  app.innerHTML=view();
  const c=document.querySelector('.F .toc a.cur');c&&c.scrollIntoView({block:'nearest',inline:'center'});
  document.getElementById('round').textContent='Round '+round;
  const n=blocks.length,ok=blocks.filter(b=>st[b.id].status==='ok').length,cm=blocks.filter(b=>st[b.id].status==='cm').length,pending=n-ok-cm;
  bar.innerHTML=`<i style="width:${ok/n*100}%;background:var(--ok)"></i><i style="width:${cm/n*100}%;background:var(--cm-strong)"></i>`;
  ptext.textContent=`${ok}/${n} approved`+(cm?` · ${cm} with comments`:'');
  submit.disabled=pending>0;submit.textContent=pending>0?`${pending} to review`:cm?`Send ${cm} comment${cm>1?'s':''}`:'Approve document ✓';
  document.querySelectorAll('[data-sel]').forEach(el=>st[el.dataset.sel].comments.forEach(c=>{if(c.quote)paint(el,c.quote)}));
  save();
}
function paint(el,q){const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const i=n.data.indexOf(q);if(i>=0){const r=document.createRange();r.setStart(n,i);r.setEnd(n,i+q.length);const m=document.createElement('mark');m.className='cm';r.surroundContents(m);return}}}

/* ---------- commenting ---------- */
let pop=null;
function closePop(){pop&&pop.remove();pop=null}
function openPop(x,y,id,quote){closePop();let kind='change';
  pop=document.createElement('div');pop.className='pop';pop.style.left=Math.max(8,Math.min(x,innerWidth-310))+'px';pop.style.top=(y+scrollY+8)+'px';
  pop.innerHTML=`${quote?`<div style="font-size:12px;color:var(--muted);max-width:280px;margin-bottom:4px">“${esc(quote)}”</div>`:''}
   <div class="kinds">${['change','question','unclear'].map(k=>`<button class="${k===kind?'on':''}" data-k="${k}">${k}</button>`).join('')}</div>
   <textarea placeholder="What should change?"></textarea><div class="actions" style="margin-top:6px"><button class="btn primary">Save</button><button class="btn" data-c>Cancel</button></div>`;
  document.body.appendChild(pop);const ta=pop.querySelector('textarea');ta.focus();
  pop.querySelector('.kinds').onclick=e=>{if(e.target.dataset.k){kind=e.target.dataset.k;ta.placeholder=kind==='question'?'Ask the agent — it answers, the document stays as is':kind==='unclear'?'What is hard to follow?':'What should change?';pop.querySelectorAll('.kinds button').forEach(b=>b.classList.toggle('on',b.dataset.k===kind))}};
  pop.querySelector('[data-c]').onclick=closePop;
  pop.querySelector('.primary').onclick=()=>{if(!ta.value.trim())return;st[id].comments.push({quote,text:ta.value.trim(),kind});st[id].status='cm';closePop();render()};
}
window.blockComment=(e,id)=>{const r=e.target.getBoundingClientRect();openPop(r.left,r.bottom,id,'')};
document.addEventListener('mouseup',e=>{if(pop&&pop.contains(e.target))return;
  const s=getSelection();if(!s||s.isCollapsed)return;const t=s.toString().trim();if(t.length<2)return;
  const el=(s.anchorNode.nodeType===3?s.anchorNode.parentElement:s.anchorNode).closest('[data-sel]');if(!el)return;
  const r=s.getRangeAt(0).getBoundingClientRect();
  closePop();pop=document.createElement('div');pop.className='pop';pop.style.left=r.left+'px';pop.style.top=(r.bottom+scrollY+6)+'px';
  pop.innerHTML='<button class="btn primary" style="font-size:13px">💬 Comment</button>';document.body.appendChild(pop);
  pop.firstChild.onmousedown=ev=>{ev.preventDefault();openPop(r.left,r.bottom,el.dataset.sel,t)};
});
document.addEventListener('mousedown',e=>{if(pop&&!pop.contains(e.target))closePop()});
document.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA')return;
  if(e.key==='ArrowDown'||e.key==='ArrowRight'||e.key==='j'){e.preventDefault();cur=Math.min(cur+1,blocks.length-1);render()}
  if(e.key==='ArrowUp'||e.key==='ArrowLeft'||e.key==='k'){e.preventDefault();cur=Math.max(cur-1,0);render()}
  if(e.key==='Enter'&&!e.metaKey&&!e.ctrlKey&&!(pop&&pop.contains(e.target))){e.preventDefault();approve(blocks[cur].id)}
  if(e.key==='a'||e.key==='ф')approve(blocks[cur].id);
  if(e.key==='c'||e.key==='с'){const b=document.getElementById('cbtn');b&&b.click()}
});

/* ---------- submit / round 2 (demo) ---------- */
submit.onclick=()=>{
  const fb=blocks.filter(b=>st[b.id].status==='cm').map(b=>({block:b.id,comments:st[b.id].comments}));
  const payload=fb.length?{result:'changes_requested',round,approved:blocks.filter(b=>st[b.id].status==='ok').map(b=>b.id),feedback:fb}:{result:'approved',round};
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div><h3 style="margin-top:0">${fb.length?'Comments sent to the session':'Document approved'}</h3>
   <p style="color:var(--muted);font-size:14px">${fb.length?'The agent edits spec.md and rebuilds only the blocks it touched. This tab reloads when round 2 is ready.':'The session received the approval and moves on.'}</p>
   <pre>${esc(JSON.stringify(payload,null,2))}</pre>
   <div class="actions">${fb.length?'<button class="btn primary" id="r2">Show round 2 (demo)</button>':''}<button class="btn" id="cl">Close</button><button class="btn" id="rs">Reset demo</button></div></div>`;
  document.body.appendChild(m);m.querySelector('#cl').onclick=()=>m.remove();
  m.querySelector('#rs').onclick=()=>{try{localStorage.removeItem('iar.demo-spec')}catch(e){}location.reload()};
  const r2=m.querySelector('#r2');if(r2)r2.onclick=()=>{m.remove();toRound2()};
};
function toRound2(){const prev=round;round++;
  blocks.forEach(b=>{const s=st[b.id];
    const qs=s.comments.filter(c=>c.kind==='question');
    if(R2_PATCH[b.id]&&s.status!=='cm'){Object.assign(b,R2_PATCH[b.id]);s.wasOk=s.status==='ok';s.status='chg';s.comments=[];delete s.carried;return}
    if(s.status==='ok'){s.carried=s.carried||prev;return}
    if(R2_PATCH[b.id]){Object.assign(b,R2_PATCH[b.id]);s.status='chg';s.comments=[];return}
    if(qs.length){s.comments=qs.map(c=>({...c,reply:'Порог выбран по замеру: 10 000 строк отдаются синхронно за ~2 с. Оставить так или поменять?'}));s.status='new';return}
    s.status='new';s.comments=[]});
  cur=Math.max(0,blocks.findIndex(b=>st[b.id].status!=='ok'));render()}
const _ap=window.approve;window.approve=id=>{if(st[id].status==='chg'){st[id].status='ok';cur=nextOpen(cur);render()}else _ap(id)};

render();
</script>
